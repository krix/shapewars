<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Shapewars - a fast twin-stick arena shooter. Move with one thumb, aim and fire with the other.">
    <meta name="theme-color" content="#0a0a14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Shapewars">
    <title>Shapewars</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-180.png">
    <style>
        html, body {
            background: #000;
            margin: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        #container { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 20px; }
        #title { color: #ffc603; font-family: Monospace; font-weight: bold; font-size: clamp(32px, 6vw, 72px); letter-spacing: 12px; display: none; text-shadow: 0 0 20px rgba(255, 198, 3, 0.3); }
        canvas { border: 0 none; background: #0a0a14; display: block; touch-action: none; }
        #overlay { position: fixed; inset: 0; margin: auto; width: min(320px, 84vw); height: 160px; text-align: center; color: #ccc; font-family: Monospace; font-size: 14px; cursor: default; z-index: 20; }
        #play { color: #ffc603; font-size: 22px; font-weight: bold; background: #333; padding: 14px 48px; border: none; border-radius: 6px; cursor: pointer; letter-spacing: 2px; touch-action: manipulation; }
        #play:hover { color: #000; background: #fff; }
        #status { margin-top: 16px; }
        #hint { margin-top: 14px; color: #8b8fa3; font-size: 12px; line-height: 1.5; letter-spacing: 0.5px; }
        #fs-btn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 14px); color: #ffc603; font-family: Monospace; font-size: 13px; cursor: pointer; z-index: 25; display: none; text-decoration: none; background: rgba(0,0,0,0.55); padding: 5px 12px; border-radius: 4px; border: 1px solid #ffc603; letter-spacing: 0.5px; }
        #fs-btn:hover { color: #000; background: #ffc603; }

        /* Two-thumb touch controls */
        #touch-controls {
            position: fixed;
            inset: 0;
            z-index: 15;
            display: none;
            touch-action: none;
            pointer-events: none;
        }
        #touch-controls.visible { display: block; pointer-events: auto; }
        #touch-controls.menu-mode .stick,
        #touch-controls.menu-mode #pause-btn { display: none; }

        .stick {
            position: fixed;
            width: clamp(86px, 24vmin, 170px);
            height: clamp(86px, 24vmin, 170px);
            pointer-events: none;
            color: #ffc603;
        }
        #stick-move { left: calc(env(safe-area-inset-left, 0px) + 7vmin); bottom: calc(env(safe-area-inset-bottom, 0px) + 6vmin); }
        #stick-aim  { right: calc(env(safe-area-inset-right, 0px) + 7vmin); bottom: calc(env(safe-area-inset-bottom, 0px) + 6vmin); }
        .stick .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid rgba(255, 198, 3, 0.30);
            background: radial-gradient(circle at 50% 50%, rgba(255, 198, 3, 0.07), rgba(10, 10, 20, 0.20) 66%, rgba(10, 10, 20, 0.05));
            box-shadow: inset 0 0 24px rgba(255, 198, 3, 0.05);
        }
        .stick .knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 42%;
            height: 42%;
            margin: 0;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 34%, rgba(255, 235, 160, 0.95), rgba(255, 198, 3, 0.55) 52%, rgba(255, 150, 0, 0.22));
            border: 1px solid rgba(255, 220, 100, 0.65);
            box-shadow: 0 0 18px rgba(255, 198, 3, 0.22);
            transform: translate(-50%, -50%);
            will-change: transform;
        }
        .stick.active .ring { border-color: rgba(255, 198, 3, 0.65); background: radial-gradient(circle, rgba(255, 198, 3, 0.12), rgba(10, 10, 20, 0.25) 70%); }
        .stick.active { color: #fff; }
        .stick .label {
            position: absolute;
            left: 50%;
            top: calc(100% + 2px);
            transform: translateX(-50%);
            font-family: Monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            color: rgba(255, 198, 3, 0.55);
            white-space: nowrap;
        }
        .stick.active .label { color: rgba(255, 226, 120, 0.9); }

        #pause-btn {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 12px);
            right: calc(env(safe-area-inset-right, 0px) + 14px);
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(255, 198, 3, 0.45);
            background: rgba(10, 10, 20, 0.55);
            color: #ffc603;
            font-family: Monospace;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 22;
            touch-action: none;
        }
        #touch-controls.visible #pause-btn { pointer-events: auto; }

        #rotate-hint {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(5, 6, 12, 0.92);
            color: #ffc603;
            font-family: Monospace;
            font-size: clamp(16px, 4vw, 26px);
            letter-spacing: 2px;
            text-align: center;
            pointer-events: none;
        }
        body.game-loaded #rotate-hint { display: none; }
        @media (orientation: portrait) and (pointer: coarse) {
            body.game-loaded #rotate-hint { display: flex; }
        }
        @media (pointer: coarse) {
            #fs-btn { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="title">SHAPEWARS</div>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <a id="fs-btn" href="#">[ fullscreen ]</a>
    <div id="overlay">
        <button id="play">PLAY</button>
        <div id="status"></div>
        <div id="hint"></div>
    </div>

    <div id="touch-controls" aria-hidden="true">
        <div class="stick" id="stick-move"><div class="ring"></div><div class="knob"></div><span class="label">MOVE</span></div>
        <div class="stick" id="stick-aim"><div class="ring"></div><div class="knob"></div><span class="label">AIM + FIRE</span></div>
        <div id="pause-btn" role="button" aria-label="Pause">II</div>
    </div>
    <div id="rotate-hint">Rotate your device to play</div>

    <script>
        var gameLoaded = false;
        var fsBtn = document.getElementById('fs-btn');
        var overlay = document.getElementById('overlay');
        var canvas = document.getElementById('canvas');
        var title = document.getElementById('title');
        var container = document.getElementById('container');
        var touchControls = document.getElementById('touch-controls');
        var pauseBtn = document.getElementById('pause-btn');
        var hint = document.getElementById('hint');
        var GAME_RATIO = 16 / 9;
        var PAD = 30;
        var IS_TOUCH = window.matchMedia('(pointer: coarse)').matches ||
            (navigator.maxTouchPoints > 0 && Math.min(screen.width, screen.height) < 900);
        var touchMode = 0;

        if (IS_TOUCH) {
            hint.textContent = 'Two thumbs: move left, aim + fire right';
        }

        function viewportWidth() {
            return (window.visualViewport && window.visualViewport.width) || window.innerWidth;
        }
        function viewportHeight() {
            return (window.visualViewport && window.visualViewport.height) || window.innerHeight;
        }

        function sizeCanvas() {
            var isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFS || IS_TOUCH) {
                title.style.display = 'none';
                canvas.style.width = Math.floor(viewportWidth()) + 'px';
                canvas.style.height = Math.floor(viewportHeight()) + 'px';
                return;
            }
            title.style.display = 'block';
            var titleH = title.offsetHeight || 0;
            var availW = window.innerWidth - PAD * 2;
            var availH = window.innerHeight - titleH - PAD * 3;
            if (availW < 320 || availH < 180) {
                canvas.style.width = '320px';
                canvas.style.height = '180px';
                return;
            }
            var w, h;
            if (availW / availH > GAME_RATIO) {
                h = availH;
                w = h * GAME_RATIO;
            } else {
                w = availW;
                h = w / GAME_RATIO;
            }
            canvas.style.width = Math.floor(w) + 'px';
            canvas.style.height = Math.floor(h) + 'px';
        }

        function setCursorHidden(hidden) {
            canvas.style.cursor = hidden && !IS_TOUCH ? 'none' : '';
        }

        function updateTouchUi() {
            var visible = IS_TOUCH && gameLoaded;
            touchControls.classList.toggle('visible', visible);
            touchControls.classList.toggle('menu-mode', touchMode !== 1);
            document.body.classList.toggle('game-loaded', gameLoaded);
        }

        window.__shapewarsSetTouchMode = function(mode) {
            touchMode = mode;
            updateTouchUi();
        };

        function onFullscreenChange() {
            sizeCanvas();
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                fsBtn.style.display = 'none';
                if (gameLoaded) setCursorHidden(true);
            } else {
                if (gameLoaded && !IS_TOUCH) {
                    fsBtn.style.display = 'inline';
                    setCursorHidden(true);
                }
            }
        }

        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        window.addEventListener('resize', sizeCanvas);
        window.addEventListener('orientationchange', function() { setTimeout(sizeCanvas, 60); });
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', sizeCanvas);
            window.visualViewport.addEventListener('scroll', sizeCanvas);
        }

        var Module = {
            canvas: canvas,
            setStatus: function(text) {
                var statusEl = document.getElementById('status');
                if (!text) {
                    gameLoaded = true;
                    overlay.style.display = 'none';
                    setCursorHidden(true);
                    sizeCanvas();
                    updateTouchUi();
                    if (!IS_TOUCH && !document.fullscreenElement && !document.webkitFullscreenElement) {
                        fsBtn.style.display = 'inline';
                    }
                }
                statusEl.textContent = text;
            }
        };
        document.getElementById('play').addEventListener('click', function() {
            sizeCanvas();
            this.style.display = 'none';
            hint.textContent = '';
            if (IS_TOUCH) {
                // These calls must happen inside the user gesture.
                var root = document.documentElement;
                if (root.requestFullscreen) {
                    root.requestFullscreen().catch(function() {});
                } else if (root.webkitRequestFullscreen) {
                    root.webkitRequestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(function() {});
                }
            }
            var s = document.createElement('script');
            s.src = 'shapewars.js';
            document.head.appendChild(s);
        });
        fsBtn.addEventListener('click', function(e) {
            e.preventDefault();
            var el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen();
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            }
        });

        (function() {
            if (!IS_TOUCH) return;

            function exportCall(name, a, b, c) {
                if (window.Module && typeof window.Module[name] === 'function') {
                    window.Module[name](a, b, c);
                }
            }

            // Touch coordinates are normalized to the canvas, then the game
            // maps them into its letterboxed 1280x720 viewport.
            function normalized(e) {
                var r = canvas.getBoundingClientRect();
                return {
                    x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
                    y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
                };
            }

            var sticks = [];
            function makeStick(id, fn) {
                var el = document.getElementById(id);
                sticks.push({
                    el: el,
                    knob: el.querySelector('.knob'),
                    fn: fn,
                    pointerId: null,
                    cx: 0,
                    cy: 0,
                    radius: 1,
                    moved: false,
                    lastX: 0,
                    lastY: 0
                });
            }
            makeStick('stick-move', '_shapewars_touch_move');
            makeStick('stick-aim', '_shapewars_touch_aim');

            var tapPointerId = null;
            var tapPos = null;

            function resetStick(stick, allowTap) {
                if (stick.pointerId === null) return;
                stick.pointerId = null;
                stick.el.classList.remove('active');
                stick.el.style.left = '';
                stick.el.style.top = '';
                stick.el.style.bottom = '';
                stick.el.style.right = '';
                stick.el.style.transform = '';
                stick.knob.style.transform = 'translate(-50%, -50%)';
                exportCall(stick.fn, 0, 0);

                // A quick tap inside a stick zone is also a normal tap, so
                // "tap to restart" and menu selection still work everywhere.
                if (allowTap && !stick.moved) {
                    var p = normalized({ clientX: stick.lastX, clientY: stick.lastY });
                    exportCall('_shapewars_touch_tap', p.x, p.y, 1);
                    exportCall('_shapewars_touch_tap', p.x, p.y, 0);
                }
            }

            function resetAll() {
                for (var i = 0; i < sticks.length; i++) resetStick(sticks[i], false);
                if (tapPointerId !== null && tapPos) {
                    exportCall('_shapewars_touch_tap', tapPos.x, tapPos.y, 0);
                }
                tapPointerId = null;
                tapPos = null;
                exportCall('_shapewars_touch_reset', 0, 0);
            }

            function startStick(stick, e) {
                stick.pointerId = e.pointerId;
                stick.moved = false;
                stick.lastX = e.clientX;
                stick.lastY = e.clientY;
                stick.el.classList.add('active');
                // Float the stick to the thumb so it is always under the
                // finger, even on wide phones or small hands.
                var w = stick.el.offsetWidth;
                var h = stick.el.offsetHeight;
                var x = Math.min(viewportWidth() - w * 0.25, Math.max(w * 0.25, e.clientX));
                var y = Math.min(viewportHeight() - h * 0.25, Math.max(h * 0.25, e.clientY));
                stick.el.style.left = x + 'px';
                stick.el.style.top = y + 'px';
                stick.el.style.bottom = 'auto';
                stick.el.style.right = 'auto';
                stick.el.style.transform = 'translate(-50%, -50%)';
                stick.cx = x;
                stick.cy = y;
                stick.radius = Math.max(28, Math.min(w, h) * 0.36);
                stick.el.setPointerCapture(e.pointerId);
                moveStick(stick, e.clientX, e.clientY);
            }

            function moveStick(stick, clientX, clientY) {
                stick.lastX = clientX;
                stick.lastY = clientY;
                var dx = clientX - stick.cx;
                var dy = clientY - stick.cy;
                var len = Math.sqrt(dx * dx + dy * dy);
                if (len > 8) stick.moved = true;
                if (len > stick.radius) {
                    dx = dx / len * stick.radius;
                    dy = dy / len * stick.radius;
                }
                stick.knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
                var nx = dx / stick.radius;
                var ny = dy / stick.radius;
                var dead = 0.14;
                if (Math.abs(nx) < dead && Math.abs(ny) < dead) {
                    nx = 0;
                    ny = 0;
                }
                exportCall(stick.fn, nx, ny);
            }

            function findStick(pointerId) {
                for (var i = 0; i < sticks.length; i++) {
                    if (sticks[i].pointerId === pointerId) return sticks[i];
                }
                return null;
            }

            touchControls.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'mouse' && !IS_TOUCH) return;
                e.preventDefault();

                if (e.target === pauseBtn || pauseBtn.contains(e.target)) {
                    exportCall('_shapewars_touch_pause', 1, 0);
                    pauseBtn.setPointerCapture(e.pointerId);
                    return;
                }

                if (touchMode === 1 && e.clientY > viewportHeight() * 0.42) {
                    var stick = e.clientX < viewportWidth() * 0.5 ? sticks[0] : sticks[1];
                    if (stick.pointerId === null) {
                        startStick(stick, e);
                        return;
                    }
                }

                if (tapPointerId === null) {
                    tapPointerId = e.pointerId;
                    tapPos = normalized(e);
                    exportCall('_shapewars_touch_tap', tapPos.x, tapPos.y, 1);
                    touchControls.setPointerCapture(e.pointerId);
                }
            });

            touchControls.addEventListener('pointermove', function(e) {
                var stick = findStick(e.pointerId);
                if (stick) {
                    e.preventDefault();
                    moveStick(stick, e.clientX, e.clientY);
                    return;
                }
                if (e.pointerId === tapPointerId && tapPos) {
                    e.preventDefault();
                    tapPos = normalized(e);
                    // Keep the press alive while the finger moves; this
                    // updates the hovered menu item without a new click.
                    exportCall('_shapewars_touch_tap', tapPos.x, tapPos.y, 1);
                }
            });

            function endPointer(e) {
                var stick = findStick(e.pointerId);
                if (stick) {
                    e.preventDefault();
                    resetStick(stick, true);
                    return;
                }
                if (e.pointerId === tapPointerId) {
                    e.preventDefault();
                    exportCall('_shapewars_touch_tap', tapPos.x, tapPos.y, 0);
                    tapPointerId = null;
                    tapPos = null;
                }
                if (e.target === pauseBtn || pauseBtn.contains(e.target)) {
                    exportCall('_shapewars_touch_pause', 0, 0);
                }
            }

            touchControls.addEventListener('pointerup', endPointer);
            touchControls.addEventListener('pointercancel', function(e) {
                endPointer(e);
                resetAll();
            });
            touchControls.addEventListener('lostpointercapture', function(e) {
                var stick = findStick(e.pointerId);
                if (stick) resetStick(stick, false);
            });
            touchControls.addEventListener('contextmenu', function(e) { e.preventDefault(); });

            window.addEventListener('blur', resetAll);
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) resetAll();
            });
            window.__shapewarsResetTouch = resetAll;
        })();

        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').catch(function() {});
            });
        }
    </script>
</body>
</html>
